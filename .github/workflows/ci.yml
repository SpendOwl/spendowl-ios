name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-ios:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinned to a specific Xcode, unlike the jobs above. Pinning to
      # Xcode 16.2 made this job fail intermittently — some runner images carry that
      # Xcode without its iOS platform, and xcodebuild then reports "iOS 18.2 is not
      # installed" with no destination available. The runner's default Xcode always has
      # its own platform installed. Building a Swift package also requires a
      # `-destination`, so `-sdk iphonesimulator` alone is not an option here.
      - name: Show Xcode version
        run: xcodebuild -version

      # `swift build` only ever compiles for macOS, so the `#if canImport(UIKit) &&
      # os(iOS)` branches — the UIKit background-task assertion among them — ship
      # without ever being compiled by CI. Build against the iOS SDK to cover them.
      - name: Build for iOS
        run: xcodebuild -scheme SpendOwl -destination 'generic/platform=iOS Simulator' build

  version-tag-match:
    name: Version matches tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `spendOwlVersion` is reported to the backend as `sdkVersion`, so a tag that
      # disagrees with it silently poisons per-version reporting for that release.
      - name: Compare Version.swift with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          source=$(sed -n 's/^let spendOwlVersion = "\(.*\)"$/\1/p' Sources/SpendOwl/Version.swift)
          echo "tag=$tag  Version.swift=$source"
          if [ "$tag" != "$source" ]; then
            echo "::error::Version.swift says '$source' but the tag is '$tag'"
            exit 1
          fi

  lint:
    name: Lint & Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict

      - name: Check SwiftFormat
        run: swiftformat Sources Tests --config .swiftformat --lint
