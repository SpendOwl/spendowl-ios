# SpendOwl SwiftLint Configuration
# Run: swiftlint lint --config .swiftlint.yml

# Paths to ignore
excluded:
  - .build
  - .swiftpm
  - Package.swift
  - Examples
  - Tests

# Disabled rules (with rationale)
disabled_rules:
  - line_length                    # Handled by SwiftFormat
  - trailing_whitespace            # Handled by SwiftFormat
  - vertical_whitespace            # Handled by SwiftFormat
  - opening_brace                  # Handled by SwiftFormat
  - statement_position             # Handled by SwiftFormat
  - todo                           # Allow TODO comments during development
  - nesting                        # Sometimes deep nesting is clearer

# Opt-in rules we want to enable
opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - force_unwrapping
  - yoda_condition

# Rule configurations
identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]

type_name:
  min_length: 3
  max_length: 50

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

large_tuple:
  warning: 3
  error: 4

trailing_comma:
  mandatory_comma: true

force_cast: warning
force_try: warning
force_unwrapping: warning

# Custom rules
custom_rules:
  no_print_statements:
    name: "No Print Statements"
    regex: "\\bprint\\s*\\("
    message: "Use Logger.log() instead of print()"
    severity: warning
    match_kinds:
      - identifier
